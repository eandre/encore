[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "encoredev"
version = "0.1.0"
description = "Encore SDK for Python"
readme = "README.md"
requires-python = ">=3.10"
license = "MPL-2.0"
keywords = ["encore", "backend", "framework", "api"]
authors = [
    { name = "Encore", email = "support@encore.dev" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://encore.dev"
Documentation = "https://encore.dev/docs"
Repository = "https://github.com/encoredev/encore"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "encoredev._runtime"

[tool.mypy]
python_version = "3.10"
strict = true

[tool.uv]
# Rebuild package when any rust files change
cache-keys = [{file = "pyproject.toml"}, {file = "Cargo.toml"}, {file = "src/**/*.rs"}]
# Uncomment to build rust code in development mode
config-settings = { build-args = '--profile=dev' }
