[package]
name = "encore-py-runtime"
version = "0.1.0"
edition = "2024"

[lib]
name = "encore_runtime"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.27.2", features = ["extension-module", "experimental-inspect"] }
pyo3-async-runtimes = { version = "0.27", features = ["tokio-runtime"] }
encore-runtime-core = { path = "../core" }
tokio = { version = "1.35.1", features = ["rt-multi-thread", "sync", "macros"] }
futures = "0.3.30"
serde_json = "1.0.111"
anyhow = "1.0.76"
bytes = "1.5.0"
prost = "0.12.3"
prost-types = "0.12.3"
chrono = "0.4.38"
log = "0.4.20"
num_cpus = "1.16.0"

[build-dependencies]
pyo3-build-config = "0.27.2"
