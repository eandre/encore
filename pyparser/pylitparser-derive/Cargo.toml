[package]
name = "pylitparser-derive"
version = "0.1.0"
edition = "2021"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2.0", features = ["extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0.67"
anyhow = "1.0"

[dev-dependencies]
prettyplease = "0.2"
pylitparser = { version = "0.1.0", path = "../pylitparser" }
ruff_python_ast = { git = "https://github.com/astral-sh/ruff.git", tag = "0.8.6" }
ruff_python_parser = { git = "https://github.com/astral-sh/ruff.git", tag = "0.8.6" }
ruff_text_size = { git = "https://github.com/astral-sh/ruff.git", tag = "0.8.6" }
